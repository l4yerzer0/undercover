name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'cli/**'
      - '.github/workflows/**'
      - '!**.md'
      - '!**/docs/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run CLI Tests
        run: |
          cd cli
          go test -v ./...

      - name: Cross-compile CLI Binaries
        run: |
          cd cli
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o bin/uc-linux-amd64 ./cmd/uc
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o bin/uc-linux-arm64 ./cmd/uc
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o bin/uc-darwin-amd64 ./cmd/uc
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o bin/uc-darwin-arm64 ./cmd/uc
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o bin/uc-windows-amd64.exe ./cmd/uc
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" -o bin/uc-windows-arm64.exe ./cmd/uc

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: cli/bin/*
          retention-days: 1

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: Export NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testPlayDebugUnitTest --no-daemon

      - name: Assemble Release APKs
        run: |
          cd android
          ./gradlew assembleOtherRelease --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/other/release/*.apk
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [build-cli, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CLI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: release_artifacts/cli

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release_artifacts/android

      - name: Prepare Release Metadata
        id: meta
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' android/version.properties | cut -d '=' -f2 | tr -d ' \r\n')
          VERSION_CODE=$(grep '^VERSION_CODE=' android/version.properties | cut -d '=' -f2 | tr -d ' \r\n')

          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="0.1"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="1"
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          # Generate version-metadata.json for in-app update checker
          cat <<EOF > release_artifacts/version-metadata.json
          {
            "version_code": $VERSION_CODE,
            "version_name": "$VERSION_NAME"
          }
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Undercover ${{ steps.meta.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release_artifacts/android/*.apk
            release_artifacts/cli/*
            release_artifacts/version-metadata.json
